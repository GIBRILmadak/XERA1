<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Analytics | XERA1</title>
        <script>
            (function () {
                var savedTheme = localStorage.getItem("rize-theme");
                document.documentElement.classList.toggle(
                    "light-mode",
                    savedTheme === "light",
                );
            })();
        </script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="icon" type="image/svg+xml" href="icons/logo.png" />
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/search-notification.css" />
        <link rel="stylesheet" href="css/streaming-analytics.css" />
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    </head>
    <body class="analytics-page account-intelligence-page">
        <nav>
            <a
                class="logo"
                onclick="navigateTo('discover')"
                style="cursor: pointer"
            >
                <div class="logo-img">
                    <img src="icons/logo.png" alt="XERA1 - Logo" />
                </div>
                <span>XΞRA1</span>
            </a>
            <div class="nav-links">
                <a
                    id="nav-discover"
                    class="notification-button nav-discover-btn"
                    onclick="navigateTo('discover')"
                    title="Discover"
                    aria-label="Discover"
                >
                    <svg
                        class="notification-icon nav-discover-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M3 10.5L12 3l9 7.5"></path>
                        <path d="M5 10v10h14V10"></path>
                        <path d="M9 20v-6h6v6"></path>
                    </svg>
                </a>
                <div
                    class="notification-button profile-nav-button"
                    onclick="handleProfileNavigation()"
                    id="nav-profile"
                    title="My Trajectory"
                    aria-label="My Trajectory"
                    role="button"
                >
                    <img
                        id="nav-profile-avatar"
                        class="notification-icon profile-nav-avatar"
                        src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'><rect width='40' height='40' rx='20' fill='%231f2937'/><circle cx='20' cy='16' r='6' fill='%23e5e7eb'/><path d='M8%2034c2.5-6%208-9%2012-9s9.5%203%2012%209' fill='%23e5e7eb'/></svg>"
                        alt="Avatar utilisateur"
                    />
                </div>
                <a href="login.html" id="nav-auth" data-i18n="navAuth"
                    >Login / Register</a
                >
                <div class="lang-switcher-nav">
                <select id="header-lang-select" class="nav-lang-select" aria-label="Language selection">
                    <option value="fr">FR</option>
                    <option value="en">EN</option>
                </select>
            </div>
        </div>
    </nav>

        <div id="analytics-dashboard" class="analytics-dashboard">
            <!-- Contenu injecté dynamiquement -->
        </div>

        <script src="js/router.js?v=20261004-3"></script>
        <script src="js/supabase-config.js"></script>
        <script src="js/analytics.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", async () => {
                const user = await checkAuth();

                const navAuth = document.getElementById("nav-auth");
                const navProfile = document.getElementById("nav-profile");
                if (!user) {
                    if (navAuth) navAuth.style.display = "block";
                    if (navProfile) navProfile.style.display = "none";
                } else {
                    if (navAuth) navAuth.style.display = "none";
                    if (navProfile) {
                        navProfile.style.display =
                            navProfile.classList.contains("notification-button")
                                ? "flex"
                                : "block";
                    }
                }

                const urlParams = new URLSearchParams(window.location.search);
                const userId = urlParams.get("user") || (user ? user.id : null);

                window.addEventListener("beforeunload", () => {
                    if (window.cleanupAnalytics) {
                        window.cleanupAnalytics();
                    }
                });

                if (!userId) {
                    const dashboard = document.getElementById(
                        "analytics-dashboard",
                    );
                    if (dashboard) {
                        dashboard.innerHTML = `
                            <div style="text-align:center; padding:3rem; color: var(--text-secondary);">
                                Sélectionnez un profil pour voir ses analytics.
                            </div>
                        `;
                    }
                    return;
                }

                let dashboardUser = user;
                if (!dashboardUser || dashboardUser.id !== userId) {
                    const profileResult = await getUserProfile(userId);
                    if (!profileResult.success) {
                        const dashboard = document.getElementById(
                            "analytics-dashboard",
                        );
                        if (dashboard) {
                            dashboard.innerHTML = `
                                <div style="text-align:center; padding:3rem; color: var(--text-secondary);">
                                    Impossible de charger ce profil.
                                </div>
                            `;
                        }
                        return;
                    }
                    dashboardUser = profileResult.data;
                }

                await renderAnalyticsDashboard(dashboardUser, {
                    containerId: "analytics-dashboard",
                });
            });
        </script>
        <script src="js/ui-motion.js" defer></script>
        <script src="js/i18n.js"></script>
    <script src="js/seo-schema.js"></script>
</body>
</html>
