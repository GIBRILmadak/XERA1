    <!-- Favicon & PWA -->

    <link rel="apple-touch-icon" href="/icons/logo-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" as="image" href="/icons/logo-192x192.png" />
    <link rel="preload" as="image" href="/icons/logo-512x512.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="XERA | Découvrez les trajectoires" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />

    <!-- Tailwind CSS (required for XERA layout utility classes) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Language detection (runs before React hydrates) -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('rize_lang');
          if (stored) document.documentElement.setAttribute('lang', stored.startsWith('fr') ? 'fr' : 'en');
        } catch(e) {}
      })();
    </script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Legacy JS — loaded after React mount so DOM IDs exist -->
    <script src="/js/router.js" defer></script>
    <script src="/js/supabase-config.js" defer></script>
    <script src="/js/monetization-utils.js" defer></script>
    <script src="/js/i18n.js" defer></script>
